<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vincent | 无人机配件与产品设计</title>
  <meta name="description" content="FPV 无人机配件与产品设计作品：机架、安装件、电子小板，可定制与小批量供货。">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/style.css?v=20261026-3d">
  <!-- 内容文件：要改文字/产品/图片，打开 content.js
       每次更新网站后，把下面所有 ?v= 后面的版本号改成新的（比如改日期），访客就不会看到旧缓存 -->
  <script src="content.js?v=20261026-3d"></script>
</head>
<body>
  <a class="skip" href="#parts">跳到配件</a>

  <!-- ========== 顶栏 ========== -->
  <header class="nav" id="nav">
    <div class="nav-inner">
      <a class="brand" href="#top" data-bind="name">Vincent</a>
      <nav class="nav-links" id="nav-links" aria-label="主导航">
        <a href="#parts">无人机配件</a>
        <a href="#projects">产品设计</a>
        <a href="#about">关于我</a>
        <a href="#cooperate">合作方式</a>
      </nav>
      <div class="nav-right">
        <a class="nav-resume" id="nav-resume" href="#contact" hidden>简历</a>
        <a class="pill" href="#contact">联系我</a>
        <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="nav-links" aria-label="打开菜单">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <main id="top">
    <!-- ========== 轮播大图 ========== -->
    <section class="hero" id="hero" aria-roledescription="carousel" aria-label="精选">
      <div class="slides" id="slides"></div>
      <div class="hero-ctrl">
        <div class="dots" id="dots" role="group" aria-label="选择幻灯片"></div>
        <button class="pause" id="pause" type="button" aria-label="暂停轮播"></button>
      </div>
    </section>

    <!-- ========== 无人机配件 ========== -->
    <section class="block" id="parts">
      <div class="container">
        <h2 class="block-title">无人机配件</h2>
        <p class="block-sub">自己设计、打样并装机试飞过。标“可定制”的可以按你的需求改尺寸和孔位。</p>
        <div class="cats" id="cats" role="group" aria-label="按类别筛选"></div>
        <div class="tiles" id="tiles" aria-live="polite"></div>
      </div>
    </section>

    <!-- ========== 产品设计 ========== -->
    <section class="block block-flush" id="projects">
      <div class="container">
        <h2 class="block-title">产品设计</h2>
        <p class="block-sub">无人机之外的整机产品设计，附现场实拍视频。</p>
      </div>
      <div id="project-list"></div>
    </section>

    <!-- ========== 关于我 ========== -->
    <section class="block block-gray" id="about">
      <div class="container">
        <p class="eyebrow-status" data-bind="status"></p>
        <h2 class="block-title" data-bind="about.heading"></h2>
        <p class="block-sub wide" data-bind="about.text"></p>
        <div class="skills" id="skills"></div>

        <h3 class="sub-title">一款配件是怎么做出来的</h3>
        <ol class="process" id="process"></ol>

        <h3 class="sub-title">常用工具</h3>
        <ul class="tools" id="tools"></ul>
        <p class="about-loc" data-bind="location"></p>
      </div>
    </section>

    <!-- ========== 合作方式 ========== -->
    <section class="block" id="cooperate">
      <div class="container">
        <h2 class="block-title">合作方式</h2>
        <p class="block-sub">从一张图纸到稳定供货，可以只做其中一段。</p>
        <div class="coop" id="coop"></div>
      </div>
    </section>

    <!-- ========== 联系 ========== -->
    <section class="block block-gray" id="contact">
      <div class="container">
        <h2 class="block-title">联系我</h2>
        <p class="block-sub">定制、合作、面试邀约都可以，邮件和微信一般当天回复。</p>
        <div class="quick" id="quick"></div>
      </div>
    </section>
  </main>

  <!-- ========== 页脚 ========== -->
  <footer class="footer">
    <div class="container">
      <div class="foot-cols" id="foot-cols"></div>
      <div class="foot-bottom">
        <span class="brand brand-sm" data-bind="name">Vincent</span>
        <span>© <span id="year"></span> <span data-bind="name"></span>. All rights reserved.</span>
        <span id="icp"></span>
      </div>
    </div>
  </footer>

  <!-- 弹窗：配件详情 / 视频 -->
  <dialog class="modal" id="modal" aria-labelledby="modal-title">
    <button class="modal-close" type="button" id="modal-close" aria-label="关闭">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="modal-body"></div>
  </dialog>

  <script src="assets/js/drone3d.js?v=20261026-3d"></script>
  <script src="assets/js/main.js?v=20261026-3d"></script>
</body>
</html>
